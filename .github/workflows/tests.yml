name: Source regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: cpu
            requirements: requirements.txt
          - environment: desktop
            requirements: requirements-desktop.txt
    name: ${{ matrix.environment }} / Windows / Python 3.12
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m pip check
      - run: python -B run_tests.py
