name: CPU regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -B run_tests.py
